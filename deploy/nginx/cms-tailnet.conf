# Portaal van De Koning Tegelwerken via de tailnet: hfd-web01.tail20628d.ts.net
#
# Hier draait de noodtoegang (/breakglass) en, na die login, de rest van het
# portaal. Alleen bereikbaar vanaf het Tailscale-adres van deze server en
# alleen voor adressen uit de tailnet (100.64.0.0/10); via internet bestaat
# deze host niet. Het portaal controleert het bron-IP (X-Real-IP) zelf nog eens.
#
# Certificaat: tailscale cert (Let's Encrypt via Tailscale; vereist "HTTPS
# certificates" in de Tailscale-console). Vernieuwen: deploy/systemd/
# tailscale-cert.timer. Zonder https werkt het sessiecookie (__Host-, Secure) niet.
#
#   cp deploy/nginx/cms-tailnet.conf /etc/nginx/sites-enabled/cms-tailnet.conf
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=dkt_cms_breakglass:1m rate=10r/m;

server {
  listen 100.86.87.92:443 ssl;
  http2 on;
  server_name hfd-web01.tail20628d.ts.net;
  server_tokens off;

  ssl_certificate     /etc/ssl/tailscale/hfd-web01.tail20628d.ts.net.crt;
  ssl_certificate_key /etc/ssl/tailscale/hfd-web01.tail20628d.ts.net.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/cms-tailnet.access.log;
  error_log  /var/log/nginx/cms-tailnet.error.log;

  # Alleen de tailnet; alles daarbuiten bestaat niet.
  allow 100.64.0.0/10;
  deny all;
  error_page 403 =404 /404-tailnet;
  location = /404-tailnet { internal; return 404 "Niet gevonden.\n"; }

  client_max_body_size 256k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Portal-User "";
  proxy_read_timeout 60s;

  # Noodtoegang: streng begrensd, bovenop de limiet in het portaal zelf.
  location = /breakglass {
    limit_req zone=dkt_cms_breakglass burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8132;
  }

  # Wat alleen Offerteknop rechtstreeks mag aanroepen.
  location ^~ /intern/ { return 404; }
  # Inloggen met Microsoft hoort bij cms.dekoningtegelwerken.nl (redirect-URI).
  location ^~ /auth/login { return 302 https://cms.dekoningtegelwerken.nl$request_uri; }

  location / {
    proxy_pass http://127.0.0.1:8132;
  }
}
