# cms.dekoningtegelwerken.nl — portaal (facturen, mail), VOORBEELD voor fase C
#
# Zet het portaal (dienst dekoning-facturen, 127.0.0.1:8132) publiek. Pas
# plaatsen als het inloggen met Microsoft werkt (SSO in de env, zie
# deploy/CMS-INSTALLATIE.md): zonder SSO valt de dienst terug op Basic Auth en
# hoort hij alleen lokaal bereikbaar te zijn.
#
# Het portaal regelt zelf het inloggen, de sessies, CSRF en de beveiligingskoppen
# (CSP, noindex, nosniff). nginx doet hier: https, HSTS, rate limits op /auth/
# en /graph/notify, en de koppen voor de proxy.
#
# limit_req_zone hoort in de http-context; dit bestand wordt binnen http{}
# ingelezen (sites-enabled), dus bovenaan dit bestand staat goed. De namen
# hebben een eigen voorvoegsel, zodat ze niet botsen met andere vhosts.

limit_req_zone $binary_remote_addr zone=dkt_cms_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dkt_cms_notify:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=dkt_cms_algemeen:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name cms.dekoningtegelwerken.nl;
  server_tokens off;

  # Alleen de ACME-controle mag over http.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://cms.dekoningtegelwerken.nl$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cms.dekoningtegelwerken.nl;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/cms.dekoningtegelwerken.nl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cms.dekoningtegelwerken.nl/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Eigen logbestanden: fail2ban (deploy/fail2ban/) leest de access log.
  access_log /var/log/nginx/cms.dekoningtegelwerken.nl.access.log;
  error_log  /var/log/nginx/cms.dekoningtegelwerken.nl.error.log;

  # HSTS hier; de rest van de koppen zet het portaal zelf. Locations hieronder
  # gebruiken geen add_header, anders erft deze niet door.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Formulieren en Graph-notificaties zijn klein; het portaal weigert zelf
  # alles boven 64 KB (notificaties 256 KB).
  client_max_body_size 256k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Portal-User "";
  proxy_read_timeout 60s;

  # Inloggen: login, callback, logout, check. Streng begrensd tegen raden en
  # herhalen. /auth/check wordt door nginx zelf (auth_request) als
  # subrequest aangeroepen en telt dan niet mee voor deze limiet.
  location ^~ /auth/ {
    limit_req zone=dkt_cms_auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8132;
  }

  # Webhook van Microsoft Graph: geen login, het portaal controleert zelf de
  # clientState (en het validationToken alleen tijdens het aanmaken).
  location = /graph/notify {
    limit_req zone=dkt_cms_notify burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8132;
  }

  # /intern/: wat Offerteknop rechtstreeks op 127.0.0.1:8132 aanroept
  # (webhook, mailrelay; ondertekend met HMAC). Van buiten bestaat het niet.
  # Het portaal weigert bovendien elk verzoek met X-Forwarded-For.
  location ^~ /intern/ {
    return 404;
  }

  # Interne controle voor auth_request: 200 met X-Portal-User of 401.
  location = /_portaal_check {
    internal;
    proxy_pass http://127.0.0.1:8132/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Website-admin (offertes) achter dezelfde login — LATER.
  # Besluit Bob (9 okt 2026): voorlopig linkt de tegel Offertes naar de
  # Offerteknop-tenant met zijn eigen login. Dit blok gaat pas aan als
  # Offerteknop X-Portal-User vertrouwt (alleen van 127.0.0.1) en onder een
  # padprefix kan draaien; dat gebeurt in de Offerteknop-repo.
  #
  # location ^~ /offertes/ {
  #   auth_request /_portaal_check;
  #   auth_request_set $portaal_gebruiker $upstream_http_x_portal_user;
  #   error_page 401 = @inloggen;
  #   proxy_set_header X-Portal-User $portaal_gebruiker;
  #   proxy_pass http://127.0.0.1:3100;
  # }
  #
  # location @inloggen {
  #   return 302 /auth/login?terug=$request_uri;
  # }

  # De rest: het portaal regelt zelf het inloggen.
  location / {
    limit_req zone=dkt_cms_algemeen burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8132;
  }
}
