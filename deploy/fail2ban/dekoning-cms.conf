# fail2ban-filter voor cms.dekoningtegelwerken.nl — VOORBEELD voor fase C.
# Plaatsen als /etc/fail2ban/filter.d/dekoning-cms.conf (pas na akkoord van Bob).
#
# Telt in de access log van de cms-vhost:
#  - een mislukte terugkeer van de Microsoft-login (/auth/callback met 400 of 403);
#  - elke 401 (geen geldige sessie bij een POST, een verkeerde clientState op
#    /graph/notify, of /auth/check van buitenaf zonder sessie).
# Gewone bezoekers zonder sessie krijgen een 302 naar de login en tellen dus niet mee.
# Logformaat: het standaard "combined" van nginx.

[Definition]
failregex = ^<HOST> -.*"GET /auth/callback[^"]*" (?:400|403) 
            ^<HOST> -.*"[A-Z]+ [^"]*" 401 
ignoreregex =
