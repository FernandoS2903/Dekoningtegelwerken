# dekoningtegelwerken.nl — PRODUCTIE, VOORBEELD, door Bob te installeren
#
# De live site. Openbaar en indexeerbaar: geen wachtwoord, geen noindex.
# De inhoud komt uit deploy/live-deploy.sh (alleen vanaf main, en alleen als de
# voorcontrole slaagt) en staat in /var/www/dekoningtegelwerken (geen
# git-werkkopie). www.dekoningtegelwerken.nl stuurt door naar het kale domein.
#
# Gelijk aan de preview-vhost, behalve: geen auth_basic, geen X-Robots-Tag, de
# robots.txt uit de repo, HSTS, en langer cachen van fonts en beelden. Plus
# het project-CMS: /projecten/<slug>/, de projectgrids via SSI en de
# projectfoto's onder /uploads/projecten/ komen uit het portaal.
#
# Installeren: zie deploy/README.md, "Live site".
#
# limit_req_zone hoort in de http-context; dit bestand wordt binnen http{}
# ingelezen (sites-enabled), dus bovenaan staat goed. Eigen voorvoegsel,
# zodat de naam niet botst met andere vhosts.
limit_req_zone $binary_remote_addr zone=dkt_aanvraag:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name dekoningtegelwerken.nl www.dekoningtegelwerken.nl;
  server_tokens off;

  # Alleen de ACME-controle mag over http.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://dekoningtegelwerken.nl$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dekoningtegelwerken.nl www.dekoningtegelwerken.nl;

  # www naar het kale domein (het certificaat dekt beide namen).
  if ($host = www.dekoningtegelwerken.nl) {
    return 301 https://dekoningtegelwerken.nl$request_uri;
  }
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/dekoningtegelwerken.nl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dekoningtegelwerken.nl/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /var/www/dekoningtegelwerken;
  index index.html;
  charset utf-8;

  access_log /var/log/nginx/dekoningtegelwerken.nl.access.log;
  error_log  /var/log/nginx/dekoningtegelwerken.nl.error.log;

  # Let op: nginx erft add_header niet naar een location die zelf add_header
  # gebruikt. Daarom staan alle headers hier en gebruiken de locations
  # hieronder geen add_header (alleen expires, dat erft wel goed).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  # Strikte CSP: de site gebruikt geen inline scripts of style-attributen en
  # laadt niets van buiten (fonts staan zelf gehost). De JSON-LD-blokken zijn
  # data, geen script, en vallen er niet onder.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location ^~ /.well-known/ {
    allow all;
  }

  # Vangnet: het deploy-script kopieert deze mappen niet, maar mocht er toch
  # iets staan, dan is het niet op te vragen.
  location ~ /\. { deny all; }
  location ~* \.(md|mjs|sh)$ { deny all; }
  location ^~ /_sjablonen/ { deny all; }
  location ^~ /service/ { deny all; }
  location ^~ /deploy/ { deny all; }
  location ^~ /docs/ { deny all; }
  location ^~ /test/ { deny all; }

  # Het aanvraagformulier (/offerte/) stuurt naar het portaal op
  # 127.0.0.1:8132 (service/facturen/aanvraag.mjs): opslaan, mail naar de
  # mailbox en doorsturen naar Offerteknop. Foto's worden in de browser al
  # verkleind; het portaal weigert zelf alles boven 24 MB.
  location ^~ /api/aanvraag/ {
    limit_req zone=dkt_aanvraag burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 24m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8132;
  }

  # -- Project-CMS (deploy/PROJECTEN-INSTALLATIE.md) -------------------------
  # Projectfoto's uit het portaal: alleen WebP met de vaste naamvorm
  # <slug>-<12 hex>-<breedte>.webp, rechtstreeks van schijf. De naam verandert
  # nooit van inhoud, dus een jaar cachen. Hier wordt nooit iets uitgevoerd:
  # nginx levert alleen bestanden, en alleen als image/webp. Deze regex staat
  # vóór de algemene regel voor webp hieronder, zodat hij voorgaat.
  location ~ "^/uploads/projecten/([a-z0-9-]{1,80}-[0-9a-f]{12}-[0-9]{2,5}\.webp)$" {
    alias /var/lib/dekoning/uploads/projecten/$1;
    types { }
    default_type image/webp;
    expires 365d;
  }
  # Alles anders onder /uploads/ bestaat niet.
  location /uploads/ {
    return 404;
  }

  # Projectpagina's uit het CMS (portaal, 127.0.0.1:8132). /projecten/ zelf
  # is de statische pagina; het grid daarin komt via SSI (location / hieronder).
  # Bij een 404 de gewone 404-pagina; ligt het portaal eruit, dan de statische
  # kopie uit de repo als die er is.
  location = /projecten/ {
    ssi on;
    try_files /projecten/index.html =404;
  }
  location ^~ /projecten/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 404 /404.html;
    error_page 500 502 503 504 = @projecten_statisch;
    proxy_pass http://127.0.0.1:8132;
  }
  location @projecten_statisch {
    try_files $uri $uri/index.html =404;
  }
  location = /sitemap-projecten.xml {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:8132;
  }
  # Het projectgrid voor de SSI-opdrachten in de statische pagina's. Alleen
  # als subverzoek van nginx zelf (internal); van buiten bestaat het niet.
  # Geeft het portaal een fout, dan toont de pagina het statische blok.
  location ^~ /_fragment/ {
    internal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:8132;
  }

  # site.json wordt per bezoek opnieuw gecontroleerd, zodat ingevulde
  # bedrijfsgegevens meteen zichtbaar zijn.
  location ^~ /data/ {
    expires -1;
    try_files $uri =404;
  }

  # Fonts en beelden veranderen onder dezelfde naam niet van inhoud: lang
  # cachen. Css, js en svg (logo, iconen) hebben nog geen versienummer in de
  # naam, dus kort, zodat een nieuwe uitrol snel doorkomt.
  location ~* \.(woff2|webp|jpg|png)$ {
    expires 30d;
    try_files $uri =404;
  }
  location ~* \.(css|js|svg)$ {
    expires 1h;
    try_files $uri =404;
  }

  # ssi on: de homepage en de dienstpagina's halen hun projectgrid via
  # <!--# include virtual="/_fragment/projecten/..." --> uit het CMS.
  location / {
    ssi on;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
