# preview.dekoningtegelwerken.nl — VOORBEELD, door Bob te installeren
#
# Voorvertoning van een featurebranch van dekoningtegelwerken.nl. Afgeschermd
# met een wachtwoord en op noindex, zodat er nooit halfaf werk met
# placeholders in Google belandt. De inhoud komt uit deploy/preview-deploy.sh
# en staat in /var/www/preview.dekoningtegelwerken (geen git-werkkopie).
#
# Opgezet naar het voorbeeld van staging.handsfree-digital.nl op hfd-web01:
# certificaat via certbot (webroot /var/www/html) en de ssl-instellingen hier
# zelf, want deze machine heeft geen /etc/letsencrypt/options-ssl-nginx.conf.
#
# Installeren: zie deploy/README.md.

server {
  listen 80;
  listen [::]:80;
  server_name preview.dekoningtegelwerken.nl;
  server_tokens off;

  # Alleen de ACME-controle mag over http en zonder wachtwoord.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name preview.dekoningtegelwerken.nl;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/preview.dekoningtegelwerken.nl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.dekoningtegelwerken.nl/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /var/www/preview.dekoningtegelwerken;
  index index.html;
  charset utf-8;

  access_log /var/log/nginx/preview.dekoningtegelwerken.nl.access.log;
  error_log  /var/log/nginx/preview.dekoningtegelwerken.nl.error.log;

  # Wachtwoord voor de hele preview. Bestand aanmaken: zie deploy/README.md.
  auth_basic "Preview De Koning Tegelwerken";
  auth_basic_user_file /etc/nginx/.htpasswd-dekoning-preview;

  # Let op: nginx erft add_header niet naar een location die zelf add_header
  # gebruikt. Daarom staan alle headers hier en gebruiken de locations
  # hieronder geen add_header (alleen expires, dat erft wel goed).
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  # Strikte CSP: de site gebruikt geen inline scripts of style-attributen en
  # laadt niets van buiten (fonts staan zelf gehost). De JSON-LD-blokken zijn
  # data, geen script, en vallen er niet onder.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Een zoekmachine ziet een wachtwoordvenster niet als instructie, dus ook
  # een robots.txt die alles weigert en zelf geen wachtwoord vraagt. (De
  # robots.txt in de repo is die voor productie; deze gaat voor.)
  location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location ^~ /.well-known/ {
    auth_basic off;
    allow all;
  }

  # Vangnet: het deploy-script kopieert deze mappen niet, maar mocht er toch
  # iets staan, dan is het niet op te vragen.
  location ~ /\. { deny all; }
  location ~* \.(md|mjs|sh)$ { deny all; }
  location ^~ /_sjablonen/ { deny all; }
  location ^~ /service/ { deny all; }
  location ^~ /deploy/ { deny all; }
  location ^~ /docs/ { deny all; }
  location ^~ /test/ { deny all; }

  # site.json wordt per bezoek opnieuw gecontroleerd, zodat ingevulde
  # bedrijfsgegevens meteen zichtbaar zijn.
  location ^~ /data/ {
    expires -1;
    try_files $uri =404;
  }

  # Fonts, css, js en iconen: kort cachen in de preview (in productie langer,
  # met versienummers in de bestandsnamen).
  location ~* \.(woff2|css|js|svg)$ {
    expires 10m;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
